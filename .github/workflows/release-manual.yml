name: "Deploy Release Images"

# Builds and pushes versioned images when a GitHub Release is published, and can
# also be run by hand. This fork can't use release-please's automated flow --
# the org disables "Allow GitHub Actions to create and approve pull requests" --
# so releases are created manually (the Releases UI or `gh release create`) and
# this workflow produces the versioned images for them.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.7.0 (defaults to the release tag)"
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version and tags
        id: set_vars
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          fi
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "No version provided and no release tag to fall back on." >&2
            exit 1
          fi

          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"

          echo "NZBDAV_VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

          GHCR_REPO="ghcr.io/${{ github.repository }}"
          {
            echo "TAGS<<EOF"
            echo "${GHCR_REPO}:latest"
            echo "${GHCR_REPO}:${MAJOR}.x"
            echo "${GHCR_REPO}:${MAJOR}.${MINOR}.x"
            echo "${GHCR_REPO}:${VERSION}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.set_vars.outputs.TAGS }}
          build-args: |
            NZBDAV_VERSION=${{ steps.set_vars.outputs.NZBDAV_VERSION }}
            REPO_URL=https://github.com/${{ github.repository }}
